version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting_assistant_db
    environment:
      POSTGRES_DB: meeting_assistant
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting_assistant_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_assistant_backend
    environment:
      - DATABASE_URL=postgresql://meeting_user:meeting_password@postgres:5432/meeting_assistant
      - SECRET_KEY=antigravity_production_super_secret_jwt_key_2026
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WHISPER_MODEL=base
      - WHISPER_CPU_THREADS=4
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_assistant_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
